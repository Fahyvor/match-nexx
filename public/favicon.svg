<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="55%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#040406" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2a3042" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF0055" stop-opacity="0.8" />
    </linearGradient>

    <!-- Cyan Beam Gradient -->
    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70FBFF" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0077FE" />
    </linearGradient>

    <!-- Pink Beam Gradient -->
    <linearGradient id="pinkBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5588" />
      <stop offset="50%" stop-color="#FF0055" />
      <stop offset="100%" stop-color="#C20040" />
    </linearGradient>

    <!-- Center Nexus Blend Glow -->
    <radialGradient id="nexusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2F9FF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45" />
    </filter>
  </defs>

  <!-- Base Squircle with Glowing Border -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Ambient Color Clouds -->
  <circle cx="170" cy="180" r="130" fill="#00E5FF" opacity="0.14" filter="url(#ambientBlur)" />
  <circle cx="340" cy="330" r="130" fill="#FF0055" opacity="0.14" filter="url(#ambientBlur)" />

  <!-- MATCH.NEXX Geometric Nexus Monogram (M + X) -->
  <g filter="url(#softGlow)">
    <!-- Left Cyan Pillar & Chevron -->
    <path d="M 120 376 L 168 140 C 170 130 178 124 188 124 L 226 124 C 238 124 246 134 244 146 L 214 366 C 212 376 204 382 194 382 L 138 382 C 126 382 118 372 120 376 Z" fill="url(#cyanBeam)" />

    <!-- Cyan Diagonal (Descending to Center Nexus) -->
    <path d="M 226 130 L 312 256 C 318 265 330 265 336 256 L 372 204 L 324 130 L 254 130 Z" fill="url(#cyanBeam)" opacity="0.95" />

    <!-- Lower-Left Cyan Crossing Fin -->
    <path d="M 200 376 L 256 294 L 298 356 L 246 376 Z" fill="url(#cyanBeam)" opacity="0.9" />

    <!-- Right Pink Pillar & Chevron -->
    <path d="M 392 136 L 344 372 C 342 382 334 388 324 388 L 286 388 C 274 388 266 378 268 366 L 298 146 C 300 136 308 130 318 130 L 374 130 C 386 130 394 140 392 136 Z" fill="url(#pinkBeam)" />

    <!-- Pink Diagonal (Ascending from Center Nexus to Top Right) -->
    <path d="M 286 382 L 200 256 C 194 247 182 247 176 256 L 140 308 L 188 382 L 258 382 Z" fill="url(#pinkBeam)" opacity="0.95" />

    <!-- Upper-Right Pink Crossing Fin -->
    <path d="M 312 136 L 256 218 L 214 156 L 266 136 Z" fill="url(#pinkBeam)" opacity="0.9" />

    <!-- Center Nexus Fusion Core (Intersection Light) -->
    <polygon points="256,224 286,256 256,288 226,256" fill="url(#nexusGlow)" />
    <circle cx="256" cy="256" r="12" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="24" fill="#00E5FF" opacity="0.4" />
  </g>
</svg>