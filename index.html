<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>MatchNexx | AI Job Matching, Talent Pipeline & CV Intelligence</title>
    <meta
      name="description"
      content="MatchNexx bridges elite tech talent and recruiters with AI-driven CV structuring, live application pipeline tracking, and instant candidate matching."
    />
    <meta
      name="keywords"
      content="MatchNexx, tech jobs, tech recruitment Nigeria, AI resume builder, CV structurer, recruiter talent pool, developer jobs, job matching, remote jobs Africa"
    />
    <meta name="author" content="MatchNexx" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://match-nexx.onrender.com/" />

    <!-- Geo & Regional SEO -->
    <meta name="geo.region" content="NG-LA" />
    <meta name="geo.placename" content="Lagos, Nigeria" />

    <!-- Mobile & PWA Optimization -->
    <meta name="theme-color" content="#070708" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MatchNexx" />
    <meta name="application-name" content="MatchNexx" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicons & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MatchNexx" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:title"
      content="MatchNexx | AI Job Matching, Talent Pipeline & CV Intelligence"
    />
    <meta
      property="og:description"
      content="Bridge elite tech talent with intelligent hiring systems. Automated CV structuring, real-time telemetry, and direct recruiter synchronization."
    />
    <meta property="og:url" content="https://match-nexx.onrender.com/" />
    <meta property="og:image" content="https://match-nexx.onrender.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://match-nexx.onrender.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MatchNexx - AI-Powered Talent Pipeline & CV Intelligence Platform" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@iamfavour3" />
    <meta name="twitter:creator" content="@iamfavour3" />
    <meta
      name="twitter:title"
      content="MatchNexx | AI Job Matching, Talent Pipeline & CV Intelligence"
    />
    <meta
      name="twitter:description"
      content="Bridge elite tech talent with intelligent hiring systems. Automated CV structuring, real-time telemetry, and direct recruiter synchronization."
    />
    <meta name="twitter:image" content="https://match-nexx.onrender.com/og-image.png" />
    <meta name="twitter:image:alt" content="MatchNexx Platform Preview" />

    <!-- Schema.org Structured Data (Organization + WebSite + SoftwareApplication) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://match-nexx.onrender.com/#organization",
            "name": "MatchNexx",
            "url": "https://match-nexx.onrender.com",
            "logo": {
              "@type": "ImageObject",
              "url": "https://match-nexx.onrender.com/favicon.svg"
            },
            "description": "Intelligent talent pipeline and job matching platform connecting elite talent with engineering teams.",
            "sameAs": [
              "https://x.com/iamfavour3",
              "https://linkedin.com/in/fahyvor",
              "https://github.com/fahyvor/match-nexx"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://match-nexx.onrender.com/#website",
            "url": "https://match-nexx.onrender.com",
            "name": "MatchNexx",
            "publisher": {
              "@id": "https://match-nexx.onrender.com/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://match-nexx.onrender.com/jobs?search={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "MatchNexx",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "description": "Automated CV structuring, live application pipeline tracking, and recruiter talent matching engine.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "NGN"
            }
          }
        ]
      }
    </script>

    <!-- Theme initialization -->
    <script>
      (() => {
        const theme = localStorage.getItem("theme") || "dark";
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
