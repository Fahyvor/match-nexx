<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>MatchNexx | Find Jobs & Make Job Hunting Easier</title>

    <meta
      name="description"
      content="Find relevant job opportunities and make job hunting easier with MatchNexx. Discover jobs, explore opportunities, and take the next step in your career."
    />

    <meta
      name="keywords"
      content="MatchNexx, networking, connections, professional networking, people, communities, matchmaking"
    />

    <meta name="author" content="MatchNexx" />

    <meta name="robots" content="index, follow" />

    <link
      rel="canonical"
      href="https://match-nexx.onrender.com/"
    />

    <link rel="icon" href="/favicon.ico" />

    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="MatchNexx | Find Jobs & Make Job Hunting Easier"
    />

    <meta
      property="og:description"
      content="Find relevant job opportunities and make job hunting easier with MatchNexx. Discover jobs, explore opportunities, and take the next step in your career."
    />

    <meta
      property="og:url"
      content="https://match-nexx.onrender.com/"
    />

    <meta
      property="og:image"
      content="https://match-nexx.onrender.com/og-image.png"
    />

    <meta property="og:site_name" content="MatchNexx" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="MatchNexx | Connect, Discover & Build Meaningful Connections"
    />

    <meta
      name="twitter:description"
      content="Find relevant job opportunities and make job hunting easier with MatchNexx. Discover jobs, explore opportunities, and take the next step in your career."
    />

    <meta
      name="twitter:image"
      content="https://match-nexx.onrender.com/og-image.png"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Theme initialization -->
    <script>
      (() => {
        const theme = localStorage.getItem("theme") || "dark";

        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
